<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altakween Research Hub · منصة البحث – مدارس التكوين</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a26;--mut:#5d6b66;--br:#ddd8c8;--ac:#0f6b4f;--me:#e3f1ea;--bad:#a8321f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2420;--tx:#eaf0ed;--mut:#9fb0a9;--br:#2f3b36;--ac:#4cc39a;--me:#21382f;--bad:#ff8c78}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2420;--tx:#eaf0ed;--mut:#9fb0a9;--br:#2f3b36;--ac:#4cc39a;--me:#21382f;--bad:#ff8c78}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ac);color:#fff}
header h1{font-size:1rem;margin:0}
button,input,textarea,select{font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.lang{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button.on,.lang{background:#fff;color:#0f6b4f;font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,select{flex:1;min-width:150px;padding:10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
textarea{min-height:120px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn:disabled{opacity:.5}
#chat{display:flex;flex-direction:column;gap:10px;min-height:160px}
.msg{padding:10px 14px;border-radius:12px;border:1px solid var(--br);background:var(--card)}
.me{background:var(--me);align-self:flex-start;max-width:92%}
.bad{border-color:var(--bad);color:var(--bad)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.links a{display:block;text-decoration:none;color:var(--tx);border:1px solid var(--br);border-radius:10px;padding:8px 10px;background:var(--bg)}
.links small{display:block;color:var(--mut)}
.note{color:var(--mut);font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:99px;padding:4px 12px;cursor:pointer}
ul{margin:6px 0 0;padding-inline-start:20px}li{margin:4px 0;font-size:.92rem}
h2{font-size:1rem;margin:0 0 8px}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--br);border-radius:8px;padding:10px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:8px}.stats b{display:block;font-size:1.4rem;color:var(--ac)}
.warn{border-color:var(--bad);color:var(--bad)}
.hide{display:none}
.logo{background:#fff;border:1px solid var(--br);border-radius:12px;padding:10px;margin-bottom:14px;text-align:center}.logo img{max-width:100%;height:auto;max-height:150px}
</style>
</head>

 pplx:{ar:"بربلكسيتي",en:"Perplexity",f:"pplx",d:{ar:"إجابة بمصادر موثّقة",en:"Answer with cited sources"}},
 gs:{ar:"جوجل سكولر",en:"Google Scholar",f:"gs",d:{ar:"أوراق علمية واقتباسات",en:"Papers & citations"}},
 ss:{ar:"سيمانتك سكولر",en:"Semantic Scholar",f:"ss",d:{ar:"محرك أبحاث أكاديمي",en:"Academic search"}},
 cons:{ar:"كونسنسس",en:"Consensus",f:"cons",d:{ar:"ما تقوله الدراسات",en:"What studies say"}},
 wolf:{ar:"وولفرام ألفا",en:"Wolfram Alpha",f:"wolf",d:{ar:"حل ومعادلات وبيانات",en:"Solve, equations, data"}},
 sci:{ar:"سايساب",en:"SciSpace",u:"https://scispace.com",d:{ar:"اشرح الورقة العلمية",en:"Explain a paper"}},
 shamaa:{ar:"شمعة",en:"Shamaa",u:"https://shamaa.org",d:{ar:"أبحاث تربوية عربية مجانية",en:"Free Arab education research"}},
 shamra:{ar:"شمرا أكاديميا",en:"Shamra Academia",u:"https://mcp.shamra-academia.com",d:{ar:"مكتبة أبحاث عربية وإنجليزية",en:"Arabic & English library"}}
};
const BLOCK=["chatgpt","chat gpt","openai","gemini","bard","copilot","grok","deepseek","character.ai","meta ai","llama","mistral","جيميني","شات جي بي تي","شات جبت","ديب سيك","كوبايلوت"];
const T={
ar:{ttl:"منصة البحث الموثوق – مدارس التكوين الخاصة",tA:"المساعد",tR:"أبحاثي والملاحظات",tS:"المشرف",sn:"اسم الطالب",sg:"الصف",ps:"حفظ",pv:"عرض كطالب",pvx:"العودة للمشرف",det:"عرض الملخص وملاحظات الذكاء الاصطناعي",in:"دخول",sc:"رمز الصف (اختياري)",okc:"تم الانضمام إلى الصف: ",badc:"رمز الصف غير صحيح.",gate:"أدخل اسمك ورمز صفك ثم اضغط حفظ لفتح أدوات البحث.",cls:"الصفوف ورموز الدخول",cname:"اسم الصف (مثال: 7أ)",ccode:"رمز الدخول",cadd:"إنشاء صف",allc:"كل الصفوف",
 em:"البريد: ",nodb:"لم يتم تسجيل دخولك عبر دعوة المدرسة، لذلك لن تُحفظ أبحاثك ولن يراها المشرف. افتح الرابط من الدعوة المرسلة إلى بريدك.",
 pol:"هذا المساعد يوجّهك فقط إلى مصادر موثوقة، ولا يستخدم ChatGPT أو Gemini أو أي أداة غير معتمدة.",
 q:"اكتب سؤال بحثك…",go:"اسأل",hi:"مرحبًا! اكتب سؤال بحثك وسأختار لك أنسب المصادر الموثوقة.",
 ex:["ما أسباب تغيّر المناخ في الخليج العربي؟","فوائد النوم للتحصيل الدراسي","حل المعادلة x^2 - 5x + 6 = 0"],
 pick:"اخترت لك هذه المصادر الموثوقة. افتحها وقارن بين مصدرين على الأقل:",copy:"بعض الأدوات لا تقبل السؤال مباشرة: عند الضغط يُنسخ سؤالك ثم الصقه فيها.",tip:"اكتب الإجابة بصياغتك واذكر مصادرك.",
 refuse:"عذرًا، هذه الأداة غير معتمدة للبحث المدرسي. المسموح فقط أدوات البحث الموثوقة.",open:"افتح ↗",
 h_note:"اكتب ملخص بحثك واحصل على ملاحظات",topic:"عنوان البحث",note:"اكتب ملخص بحثك ومصادرك هنا…",fb:"احصل على ملاحظات لتحسين بحثي",wait:"جارٍ التحليل…",
 h_sup:"ملاحظات المشرف",h_hist:"سجل أبحاثي",none:"لا يوجد شيء بعد.",
 l1:"الطلاب",l2:"عمليات البحث",l3:"زيارات الأدوات",all:"كل الطلاب",an:"حلّل أبحاث الطالب بالذكاء الاصطناعي",stext:"اكتب ملاحظاتك للطالب…",send:"أرسل للطالب",sent:"تم الإرسال ✔",pickst:"اختر طالبًا للتحليل.",
 lang:"Arabic",err:"تعذّر إكمال الطلب. حاول مرة أخرى."},
en:{ttl:"Trusted Research Hub – Altakween Private Schools",tA:"Assistant",tR:"My research & feedback",tS:"Supervisor",sn:"Student name",sg:"Grade",ps:"Save",pv:"View as student",pvx:"Back to supervisor",det:"View summary & AI feedback",in:"Entered",sc:"Class passcode (optional)",okc:"Joined class: ",badc:"Wrong class passcode.",gate:"Enter your name and class passcode, then press Save to unlock the research tools.",cls:"Classes & passcodes",cname:"Class name (e.g. 7A)",ccode:"Passcode",cadd:"Create class",allc:"All classes",
 em:"Email: ",nodb:"You are not signed in through the school invitation, so your research will not be saved or seen by the supervisor. Open the link from the invitation sent to your email.",
 pol:"This assistant only points you to trusted sources. It does not use ChatGPT, Gemini or any unapproved tool.",
 q:"Type your research question…",go:"Ask",hi:"Hello! Type your research question and I’ll pick the best trusted sources.",
 ex:["Causes of climate change in the Arabian Gulf","Benefits of sleep for school performance","Solve x^2 - 5x + 6 = 0"],
 pick:"I picked these trusted sources. Open them and compare at least two:",copy:"Some tools can’t take a question by link: clicking copies your question, then paste it there.",tip:"Write in your own words and cite your sources.",
 refuse:"Sorry, that tool isn’t approved for school research. Only trusted research tools are allowed.",open:"Open ↗",
 h_note:"Write your research summary and get feedback",topic:"Research title",note:"Write your research summary and sources here…",fb:"Get feedback to improve my research",wait:"Analysing…",
 h_sup:"Supervisor feedback",h_hist:"My research history",none:"Nothing yet.",
 l1:"Students",l2:"Searches",l3:"Tool visits",all:"All students",an:"Analyse this student’s research with AI",stext:"Write your feedback to the student…",send:"Send to student",sent:"Sent ✔",pickst:"Choose a student to analyse.",
 lang:"English",err:"Could not complete the request. Please try again."}};
let L=(()=>{try{return localStorage.getItem("lang")||"ar"}catch(e){return"ar"}})();
let preview=false,db=null,user=null,sample=null,uid=null,me=null,isSup=false,prof={name:"",grade:""},page="A",cache=[];
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const ls=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const when=t=>new Date(t).toLocaleString(L==="ar"?"ar-OM":"en-GB");
const tr=()=>T[L];

async function init(){
  try{ if(window.claude){user=await claude.use("user");db=await claude.use("db");sample=await claude.use("sample");} }catch(e){}
  if(user){try{me=await user.me();uid=await user.id();isSup=await user.canEdit();}catch(e){}}
  if(!uid)db=null;
  prof=lg("prof",{name:me&&me.name||"",grade:""});
  if(db){try{const p=await db.doc("data/users/"+uid+"/profile").get();if(p.exists)prof={...prof,...p.data()};}catch(e){}}
  $("sn").value=prof.name||"";$("sg").value=prof.grade||"";
  render();loadMine();if(isSup)loadSup();else if(ok())save({type:"login",q:"login"});
}
function render(){const s=tr();document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
  $("ttl").textContent=s.ttl;
  const tb=document.querySelectorAll(".tabs button[data-p]");
  tb.forEach(b=>{b.textContent=s["t"+b.dataset.p];b.classList.toggle("on",b.dataset.p===page);if(b.dataset.p==="S")b.classList.toggle("hide",!isSup||preview);else b.classList.toggle("hide",!ok())});
  $("sn").placeholder=s.sn;$("sg").placeholder=s.sg;$("ps").textContent=s.ps;$("sc").placeholder=s.sc;if(prof.cls)$("cm").textContent=s.okc+prof.cls;$("gate").textContent=ok()?"":s.gate;
  $("em").textContent=me&&me.email?s.em+me.email:"";$("nodb").textContent=db?"":s.nodb;
  $("pol").textContent=s.pol;$("q").placeholder=s.q;$("go").textContent=s.go;
  $("chips").innerHTML=s.ex.map(x=>`<button>${esc(x)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));
  $("chat").innerHTML="";add(esc(s.hi),"");
  $("h_note").textContent=s.h_note;$("topic").placeholder=s.topic;$("note").placeholder=s.note;$("fb").textContent=s.fb;
  $("h_sup").textContent=s.h_sup;$("h_hist").textContent=s.h_hist;
  $("h_cls").textContent=s.cls;$("cn").placeholder=s.cname;$("cc").placeholder=s.ccode;$("cadd").textContent=s.cadd;$("l1").textContent=s.l1;$("l2").textContent=s.l2;$("l3").textContent=s.l3;$("an").textContent=s.an;$("stext").placeholder=s.stext;$("send").textContent=s.send;
  $("pv").classList.toggle("hide",!isSup);$("pv").textContent=preview?s.pvx:s.pv;$("lb").textContent=L==="ar"?"EN":"عربي";
  ["A","R","S"].forEach(p=>$("p"+p).classList.toggle("hide",p!==page||!ok()||(p==="S"&&preview)));
  drawMine();if(isSup)drawSup();
}
function add(html,cls){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;$("chat").appendChild(d);return d}
async function save(rec){
  const r={...rec,uid:uid||"local",name:prof.name||"—",grade:prof.grade||"",cls:prof.cls||"",email:me&&me.email||"",t:Date.now()};
  if(rec.type!=="login"){cache.unshift(r);ls("alog",cache.slice(0,100));drawMine();}
  if(db){try{await db.collection("data/users/"+uid).add(r);await db.collection("research").add(r);}catch(e){}}
}
function plan(q){const ar=/[\u0600-\u06FF]/.test(q);const math=/[0-9]\s*[\+\-\*\/\^=]|solve|equation|integral|derivative|calculate|حل|معادلة|احسب|مشتق|تكامل/i.test(q);
  const o=["pplx"];if(math)o.push("wolf");else o.push("gs","ss","cons");if(ar)o.push("shamaa","shamra");else if(!math)o.push("sci");return[...new Set(o)].slice(0,6)}
function ask(q){q=q.trim();if(!q)return;const s=tr();add(esc(q),"me");
  if(BLOCK.some(b=>q.toLowerCase().includes(b))){add(esc(s.refuse),"bad");return}
  save({type:"search",q});const enc=encodeURIComponent(q);let nc=false;
  const items=plan(q).map(k=>{const r=SRC[k];const u=r.f?L_URL[r.f](enc):r.u;if(!r.f)nc=true;
   return `<a href="${u}" target="_blank" rel="noopener" data-q="${esc(q)}" data-l="${esc(r.ar+" / "+r.en)}" data-c="${r.f?"":"1"}"><b>${r[L]}</b><small>${r.d[L]}</small><small>${s.open}</small></a>`}).join("");
  const m=add(`<div>${s.pick}</div><div class="links">${items}</div>${nc?`<p class="note">${s.copy}</p>`:""}<p class="note">💡 ${s.tip}</p>`,"");
  m.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{save({type:"tool",q:a.dataset.q,tool:a.dataset.l});if(a.dataset.c){try{navigator.clipboard.writeText(a.dataset.q)}catch(e){}}}));}
async function loadMine(){
  cache=lg("alog",[]);
  if(db){try{const sn=await db.collection("data/users/"+uid).get();const r=sn.docs.map(d=>d.data()).filter(x=>x.type!=="login");if(r.length){cache=r.sort((a,b)=>b.t-a.t).slice(0,100)}}catch(e){}
    try{const sn=await db.collection("feedback").where("uid","==",uid).get();window.supfb=sn.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t)}catch(e){window.supfb=[]}}
  drawMine();
}
function drawMine(){const s=tr();
  $("hist").innerHTML=cache.length?cache.slice(0,25).map(e=>`<li>${e.type==="note"?"📝":e.type==="tool"?"🔗":"🔎"} ${esc(e.q)}${e.tool?" → "+esc(e.tool):""}<br><span class="note">${when(e.t)}</span></li>`).join(""):`<li>${s.none}</li>`;
  const f=window.supfb||[];
  $("supfb").innerHTML=f.length?f.map(e=>`<li>${esc(e.text)}<br><span class="note">${esc(e.from||"")} · ${when(e.t)}</span></li>`).join(""):`<li>${s.none}</li>`}
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("altakween:"+x.trim().toLowerCase()));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
$("ps").onclick=async()=>{const s=tr();prof={...prof,name:$("sn").value.trim(),grade:$("sg").value.trim()};const code=$("sc").value.trim();
  if(code){if(!db){$("cm").textContent=s.nodb}else{try{const h=await sha(code);const c=(await db.collection("classes").where("hash","==",h).get()).docs[0];if(c){prof.cls=c.data().name;$("cm").textContent=s.okc+prof.cls;$("sc").value=""}else{$("cm").textContent=s.badc}}catch(e){$("cm").textContent=s.err}}}
  ls("prof",prof);
  if(db){try{await db.doc("data/users/"+uid+"/profile").set({...prof,email:me&&me.email||""});await db.collection("students").doc(uid).set({...prof,email:me&&me.email||"",uid,t:Date.now()});}catch(e){}}render();loadMine();if(ok()&&!isSup)save({type:"login",q:"join"});};
function ok(){return (isSup&&!preview)||(!!db&&!!prof.name&&!!prof.cls)}
async function ai(prompt){if(!sample)throw new Error("no");const r=await sample(prompt,{cache:false});return r.text}
$("fb").onclick=async()=>{const s=tr();const note=$("note").value.trim();if(!note)return;const topic=$("topic").value.trim();
  const tools=[...new Set(cache.filter(e=>e.type==="tool").map(e=>e.tool))].slice(0,10).join(", ")||"none";
  const o=$("fbo");o.classList.remove("hide");o.textContent=s.wait;$("fb").disabled=true;
  try{const txt=await ai(`You are a kind, strict school research coach for a student in grade ${prof.grade||"unknown"}. Evaluate ONLY the student's research summary below. Reply in ${s.lang}. Use this format: 1) Strengths (2 bullets) 2) Problems (up to 3: unclear question, weak or missing sources, claims without evidence, copied-sounding text, no comparison of sources, too shallow) 3) How to improve (3 concrete steps naming which trusted tools to use: Perplexity, Google Scholar, Semantic Scholar, Consensus, Scite, SciSpace, Shamaa, Shamra Academia, Wolfram Alpha) 4) Score out of 5. Do not rewrite the research for them. Never recommend ChatGPT, Gemini or other untrusted AI. Tools the student opened: ${tools}.\nTitle: ${topic}\nSummary:\n${note}`);
    o.textContent=txt;save({type:"note",q:topic||note.slice(0,60),text:note.slice(0,3000),ai:txt.slice(0,3000)});
  }catch(e){o.textContent=s.err}$("fb").disabled=false};
// supervisor
let allR=[],allS=[],allC=[];
async function loadSup(){if(!db)return;try{allR=(await db.collection("research").orderBy("t","desc").limit(400).get()).docs.map(d=>d.data());allS=(await db.collection("students").get()).docs.map(d=>d.data());allC=(await db.collection("classes").get()).docs.map(d=>d.data())}catch(e){}drawSup()}
function drawSup(){const s=tr();const sel=$("sel");const cur=sel.value;
  const names={};allS.forEach(x=>names[x.uid]=x.name);allR.forEach(x=>{if(!names[x.uid])names[x.uid]=x.name});
  const cl={};allS.forEach(x=>cl[x.uid]=x.cls||"");const cs=$("csel"),cc=cs.value;cs.innerHTML=`<option value="">${s.allc}</option>`+[...new Set(allC.map(x=>x.name))].map(n=>`<option>${esc(n)}</option>`).join("");cs.value=cc;$("clist").textContent=allC.map(x=>x.name).join(" · ");
  sel.innerHTML=`<option value="">${s.all}</option>`+Object.keys(names).filter(k=>!cs.value||cl[k]===cs.value).map(k=>`<option value="${esc(k)}">${esc(names[k])}</option>`).join("");sel.value=cur;
  $("s1").textContent=Object.keys(names).length;$("s2").textContent=allR.filter(x=>x.type==="search").length;$("s3").textContent=allR.filter(x=>x.type==="tool").length;
  const rows=allR.filter(x=>(!sel.value||x.uid===sel.value)&&(!cs.value||(cl[x.uid]||x.cls)===cs.value)).slice(0,100);
  $("slist").innerHTML=rows.length?rows.map(e=>`<li><b>${esc(e.name)}</b> ${e.grade?"("+esc(e.grade)+")":""}${e.cls?" ["+esc(e.cls)+"]":""}${e.email?" · "+esc(e.email):""} · ${e.type==="note"?"📝":e.type==="tool"?"🔗":e.type==="login"?"🔑":"🔎"} ${e.type==="login"?s.in:esc(e.q)}${e.tool?" → "+esc(e.tool):""}<br><span class="note">${when(e.t)}</span>${e.text?`<details><summary>${s.det}</summary><div class="out">${esc(e.text)}</div><div class="out">${esc(e.ai||"")}</div></details>`:""}</li>`).join(""):`<li>${s.none}</li>`}
$("pv").onclick=()=>{preview=!preview;page="A";render()};
$("sel").onchange=drawSup;$("csel").onchange=drawSup;
$("cadd").onclick=async()=>{const n=$("cn").value.trim(),c=$("cc").value.trim();if(!n||!c||!db)return;try{await db.collection("classes").add({name:n,hash:await sha(c),t:Date.now()});$("cn").value="";$("cc").value="";await loadSup()}catch(e){}};
$("an").onclick=async()=>{const s=tr();if(!$("sel").value){$("ano").classList.remove("hide");$("ano").textContent=s.pickst;return}
  const rows=allR.filter(x=>x.uid===$("sel").value).slice(0,60).reverse();const o=$("ano");o.classList.remove("hide");o.textContent=s.wait;$("an").disabled=true;
  const lines=rows.map(e=>`[${e.type}] ${new Date(e.t).toISOString().slice(0,10)} ${e.q}${e.tool?" -> "+e.tool:""}${e.ai?" | AI feedback given: "+e.ai.slice(0,200):""}`).join("\n");
  try{o.textContent=await ai(`You assist a school supervisor reviewing one student's research activity (student: ${rows[0]?.name}, grade ${rows[0]?.grade||"?"}). Reply in ${s.lang}. Give: 1) topics researched 2) depth and progress over time 3) quality of sources used (academic tools vs only general search; any attempt to use untrusted AI) 4) strengths 5) concerns 6) three recommended actions for the supervisor. Be concise and fair.\nActivity log:\n${lines}`)}catch(e){o.textContent=s.err}$("an").disabled=false};
$("send").onclick=async()=>{const t=$("stext").value.trim();if(!t||!$("sel").value||!db)return;
  try{await db.collection("feedback").add({uid:$("sel").value,text:t,t:Date.now(),from:prof.name||me&&me.name||""});$("stext").value="";$("sent").textContent=tr().sent}catch(e){$("sent").textContent=tr().err}};
$("go").onclick=()=>{const v=$("q").value;$("q").value="";ask(v)};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("lb").onclick=()=>{L=L==="ar"?"en":"ar";try{localStorage.setItem("lang",L)}catch(e){}render()};
document.querySelectorAll(".tabs button[data-p]").forEach(b=>b.onclick=()=>{page=b.dataset.p;render();if(page==="S")loadSup()});
render();init();
</script>
</body>
</html>
