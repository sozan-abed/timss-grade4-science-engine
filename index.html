function score(e){const q=e.q,a=e.a,ty=q.ty||'mcq';
if(ty=='mcq')return a.v===0?1:0;
if(ty=='fill'){const nz=s=>(s||'').toLowerCase().trim().replace(/^ال/,'');return q.acc.map(nz).includes(nz(a.v))?1:0}
if(ty=='hot')return a.v==q.ans?1:0;

$('skills').innerHTML=[['bal',t('bal')],...Object.keys(G).map(g=>[g,t('foc')+nm(G[g])])].map(([v,l])=>`<label class="o"><input type="radio" name="sk" value="${v}" ${v==focus?'checked':''}> ${l}</label>`).join('');
document.querySelectorAll('[name=sk]').forEach(x=>x.onchange=()=>focus=x.value);render()}

function build(){const sel=[...document.querySelectorAll('[data-t]:checked')].map(x=>x.dataset.t);if(!sel.length){alert(t('few'));return}
const tsel=[...document.querySelectorAll('[data-ty]:checked')].map(c=>c.dataset.ty),n=+$('n').value,pool=B.filter(q=>sel.includes(q.t)&&tsel.includes(q.ty||'mcq')&&!q.off);
const cw={};let tot=0;for(const c in C){const has=sel.some(k=>T[k][0]==c);if(has){cw[c]=C[c][3];tot+=cw[c]}}for(const c in cw)cw[c]=cw[c]*100/tot;
const gw=focus=='bal'?{K:40,A:40,R:20}:{K:25,A:25,R:25,[focus]:50};if(focus!='bal'){for(const g in gw)if(g!=focus)gw[g]=25}
const cT=appor(n,cw),gT=appor(n,gw);let picked=[],left=shuffle(pool),short=false;
const cc={...cT};const take=(f)=>{const i=left.findIndex(f);if(i<0)return false;picked.push(left.splice(i,1)[0]);return true};
for(const g of ['R','A','K']){for(let k=0;k<gT[g];k++){const c=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]).find(x=>cc[x]>0&&left.some(q=>q.c==c&&q.g==g));
if(c){take(q=>q.c==c&&q.g==g);cc[c]--}else if(take(q=>q.g==g)){}else short=true}}
while(picked.length<n&&left.length){take(()=>true);short=true}
const order={K:0,A:1,R:2};exam=picked.sort((a,b)=>order[a.g]-order[b.g]||a.b-b.b);exam.short=short||picked.length<n;exam.n=n;render()}

function bars(obj,src,tg,total){const keys=Object.keys(obj);return keys.map(k=>`<div style="font-size:13px">${nm(obj[k])}: ${t('actual')} ${exam.filter(q=>q[src]==k).length} / ${t('target')} ${Math.round(exam.n*obj[k][3]/(tg(keys)||100))}</div><div class="bar">${exam.filter(q=>q[src]==k).length?`<span style="background:${obj[k][2]};width:${exam.filter(q=>q[src]==k).length/exam.length*100}%">${Math.round(exam.filter(q=>q[src]==k).length/exam.length*100)}%</span>`:''}</div>`).join('')}
function tags(q){return `<span class="tg" style="background:${C[q.c][2]}">${nm(C[q.c])}</span><span class="tg" style="background:${G[q.g][2]}">${nm(G[q.g])}</span><span class="tg" style="background:#555">${t('bm')} ${q.b}</span><span class="tg" style="background:#8a5a00">${tn(q.ty||'mcq',0)}</span>`}

function render(){const o=$('out');if(ST){P&&P.show();return}if(!exam.length){o.innerHTML=`<p>${t('empty')}</p>`;return}
let h=`<div class="row noprint"><button class="btn" id="stu">${t('stu')}</button><button class="btn alt" id="pr">${t('print')}</button><button class="btn alt" id="shr">${t('share')}</button><label class="o"><input type="checkbox" id="sk" ${showKey?'checked':''}> ${t('ans')}</label></div>`;
h+='<div id="shbox"></div>';if(exam.short)h+=`<div class="note">${t('short')}</div>`;
h+=`<h3>${t('content')}</h3>${bars(C,'c',()=>100)}<h3>${t('cog')}</h3>${bars(G,'g',()=>100)}<div class="${showKey?'show':''}">`;
exam.forEach((q,i)=>{if(q.ty){h+=prevX(q,i);return}const op=nm(q.o);h+=`<div class="q"><div>${tags(q)}</div><p><b>${i+1}.</b> ${nm(q.q)}</p><ol type="${L=='ar'?'أ':'A'}">${op.map((x,j)=>`<li class="${showKey&&j==0?'ok':''}">${x}</li>`).join('')}</ol><div class="k"><b>${t('key')}:</b> ${op[0]}<br><b>${t('mis')}:</b> ${nm(q.m)} · ${nm(T[q.t].slice(1))}</div></div>`});
o.innerHTML=h+'</div>';$('stu').onclick=()=>{TK='pv';play(exam)};$('shr').onclick=share;$('pr').onclick=()=>{showKey=true;render();print()};$('sk').onchange=e=>{showKey=e.target.checked;render()}}

$('lang').onclick=()=>{L=L=='en'?'ar':'en';ui()};$('gen').onclick=build;$('guide').onclick=guide;$('resbtn').onclick=results;$('n').oninput=e=>$('nv').textContent=e.target.value;
ui();
</script></body></html>
