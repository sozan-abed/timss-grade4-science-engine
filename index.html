const d=()=>{b.innerHTML=`<div class="tanks">${v.map((x,i)=>`<div class="tank"><b>${u('tank')} ${i+1}</b><label>${u('fert')}: ${x.f} g<input type="range" min="0" max="10" value="${x.f}" data-i="${i}" data-k="f"></label><label>${u('wat')}: ${x.w} ml<input type="range" min="50" max="200" step="50" value="${x.w}" data-i="${i}" data-k="w"></label><label>${u('lig')}<select data-i="${i}" data-k="l"><option value="1" ${x.l?'selected':''}>${u('sun')}</option><option value="0" ${x.l?'':'selected'}>${u('shade')}</option></select></label>${ran?`<div class="bar" style="height:${20+x.f*14}px"></div>`:''}</div>`).join('')}</div><p class="msg">${fair()?u('fair'):u('unfair')}</p><button class="btn" id="run" ${fair()?'':'disabled'}>${u('run')}</button>`};d();
b.onchange=e=>{const g=e.target.dataset;if(g.k){v[g.i][g.k]=+e.target.value;ran=0;d()}};b.onclick=e=>{if(e.target.id=='run'){ran=1;d()}};return()=>ran&&fair()},
plot(it,b){const p=[];const d=()=>{let g='';for(let i=0;i<5;i++){g+=`<line x1="${60+i*45}" y1="20" x2="${60+i*45}" y2="180" stroke="#8aa" /><text x="${60+i*45}" y="198" font-size="11" text-anchor="middle" fill="currentColor">${20+i*20}</text><line x1="45" y1="${180-i*40}" x2="240" y2="${180-i*40}" stroke="#8aa"/><text x="38" y="${184-i*40}" font-size="11" text-anchor="end" fill="currentColor">${(i+1)*10}</text>`}
const pts=p.map((r,c)=>r?`${60+c*45},${220-r*40}`:null).filter(Boolean);b.innerHTML=`<p>${u('hint')}</p><svg viewBox="0 0 270 215" class="pl">${g}<polyline points="${pts.join(' ')}" fill="none" stroke="#f5b700" stroke-width="2"/>${pts.map(x=>`<circle cx="${x.split(',')[0]}" cy="${x.split(',')[1]}" r="6" fill="#0b7a75"/>`).join('')}</svg>`};d();
b.onclick=e=>{const s=e.target.closest('svg');if(!s)return;const r=s.getBoundingClientRect(),x=(e.clientX-r.left)*270/r.width,y=(e.clientY-r.top)*215/r.height;const c=Math.max(0,Math.min(4,Math.round((x-60)/45))),w=Math.max(1,Math.min(5,Math.round((220-y)/40)));p[c]=w;d()};return()=>[0,1,2,3,4].every(c=>p[c]==5-c)},
open(it,b){b.innerHTML=`<textarea rows="5" placeholder="${u('type')}"></textarea><div id="rub"></div>`;return()=>{const x=b.querySelector('textarea').value.toLowerCase(),h=it.kw.map(r=>new RegExp(r).test(x));b.querySelector('#rub').innerHTML=it.rb.map((r,i)=>`<div>${h[i]?'✅':'⬜'} ${t(r)}</div>`).join('');return h.filter(Boolean).length>=2}}
};
const CL={K:'K',A:'Ap',R:'R'};
function build(st,n){const pool=B.filter(i=>st=='A'||i.s==st);n=Math.min(n,pool.length);const kn=Math.round(n*.4),rs=Math.round(n*.2),out=[];const pick=(c,k)=>out.push(...shuf(pool.filter(i=>i.c==c&&!out.includes(i))).slice(0,k));pick('K',kn);pick('A',n-kn-rs);pick('R',rs);if(out.length<n)out.push(...shuf(pool.filter(i=>!out.includes(i))).slice(0,n-out.length));return out.sort((a,b)=>'KAR'.indexOf(a.c)-'KAR'.indexOf(b.c))}
function start(st,n){S={items:build(st,n),i:0,res:[],t0:Date.now()};V='run';draw()}
function key(it){if(it.ty=='mcq')return t(it.o[it.a]);if(it.ty=='seq')return it.o.map(t).join(' → ');if(it.ty=='dd')return it.tl.map((x,i)=>t(x)+' = '+t(it.zn[i])).join('; ');if(it.ty=='hot')return t(it.lb[3]);if(it.ty=='open')return it.rb.map(t).join('; ');return t(it.re)}
function head(it){return `<span class="badge">${u(it.s)}</span><span class="badge">${u(CL[it.c])}</span><span class="badge t">${it.tr}</span>`}
function draw(){document.documentElement.lang=L?'ar':'en';document.documentElement.dir=L?'rtl':'ltr';$('#bh').textContent=u('home');$('#bt').textContent=u('tch');$('#bl').textContent=L?'English':'عربي';
const a=$('#app');if(V=='home'){const p=ld(),d=Object.values(p.done||{});a.innerHTML=`<section class="hero"><h1>${u('title')}</h1><p>${u('sub')}</p><div class="row"><button class="btn" id="qc">${u('quick')}</button></div></section><div class="grid"><div class="q"><h2>${d.length}</h2>${u('items')}</div><div class="q"><h2>${d.length?Math.round(100*d.filter(Boolean).length/d.length):0}%</h2>${u('acc')}</div><div class="q"><h2>${Math.round((p.time||0)/60000)}</h2>${u('min')}</div></div><div class="grid">${['L','P','E'].map(k=>`<button class="q o" data-st="${k}"><h3>${u(k)}</h3>${B.filter(i=>i.s==k).length} ✎</button>`).join('')}</div>`;$('#qc').onclick=()=>start('A',5);a.querySelectorAll('[data-st]').forEach(x=>x.onclick=()=>start(x.dataset.st,5))}
else if(V=='build'){a.innerHTML=`<h2>${u('tch')}</h2><div class="q"><div class="row"><label>${u('strand')} <select id="st">${['A','L','P','E'].map(k=>`<option value="${k}">${u(k)}</option>`).join('')}</select></label><label>${u('size')} <select id="n"><option value="5">5</option><option value="12">12</option><option value="25">25</option></select></label></div><p>${u('note')}</p><div class="row"><button class="btn" id="go">${u('launch')}</button><button id="pr">${u('print')}</button></div></div>`;$('#go').onclick=()=>start($('#st').value,+$('#n').value);$('#pr').onclick=()=>{S={items:build($('#st').value,+$('#n').value)};V='print';draw()}}
else if(V=='print'){a.innerHTML=`<div class="row noprint"><button class="btn" onclick="print()">${u('print')}</button></div><div class="pr">${S.items.map((it,i)=>`<div class="q"><h2>${i+1}. ${t(it.q)}</h2><div>${head(it)}</div>${it.ty=='mcq'?it.o.map((o,j)=>`<div>◯ ${'ABCD'[j]}. ${t(o)}</div>`).join(''):`<div class="ln"></div><div class="ln"></div>`}<small>${u('key')}: ${key(it)}</small></div>`).join('')}</div>`}
else if(V=='res')res();else show()}
function show(){const it=S.items[S.i],a=$('#app');a.innerHTML=`<div class="row"><b>${S.i+1}/${S.items.length}</b><span id="tm"></span></div><div class="q">${head(it)}<h2>${t(it.q)}</h2><div id="bx"></div></div><div class="row"><button class="btn" id="ck">${u('submit')}</button></div><div id="fb"></div>`;const chk=R[it.ty](it,$('#bx'));$('#ck').onclick=()=>{const ok=!!chk();if(S.res[S.i]===undefined)S.res[S.i]=ok;let h='';
if(ok){h=`<div class="q fb ok"><b>✅ ${u('ok')}</b></div>`;$('#ck').disabled=true}else h=`<div class="q fb"><div class="step"><b>${u('s1')}</b><br>${u(CL[it.c])}: ${u('loc')[it.c][L]}</div><div class="step"><b>${u('s2')}</b><br>${t(it.mi)}</div><div class="step"><b>${u('s3')}</b><br>${t(it.so)}</div><div class="row"><button id="rt">${u('retry')}</button><button id="rm">${u('rem')}</button></div><div id="rc"></div></div>`;
h+=`<div class="row"><button class="btn" id="nx">${S.i+1<S.items.length?u('next'):u('finish')}</button></div>`;$('#fb').innerHTML=h;if($('#rt')){$('#rt').onclick=()=>{$('#fb').innerHTML=''};$('#rm').onclick=()=>{$('#rc').innerHTML=`<div class="card"><span><b>${u('s4')}</b><br>${t(it.re)}</span></div>`}}
$('#nx').onclick=()=>{S.i++;S.i<S.items.length?show():(V='res',fin(),draw())}}}
function fin(){const p=ld();p.done=p.done||{};S.items.forEach((it,i)=>p.done[it.id]=!!S.res[i]);p.time=(p.time||0)+Date.now()-S.t0;S.ms=Date.now()-S.t0;sv(p)}
function res(){const ok=S.res.filter(Boolean).length,pc=f=>{const x=S.items.map((it,i)=>[it,S.res[i]]).filter(f);return x.length?x.filter(y=>y[1]).length/x.length:0};
const ax=[['K',i=>i[0].c=='K'],['A',i=>i[0].c=='A'],['R',i=>i[0].c=='R'],['L',i=>i[0].s=='L'],['P',i=>i[0].s=='P'],['E',i=>i[0].s=='E']].map(x=>[x[0],pc(x[1])]);
const pt=(r,k)=>{const g=k/6*2*Math.PI-Math.PI/2;return[150+r*Math.cos(g),130+r*Math.sin(g)]};
const poly=ax.map((x,k)=>pt(90*x[1],k).join(',')).join(' ');const lab=['K','Ap','R','L','P','E'];
$('#app').innerHTML=`<h2>${u('score')}: ${ok}/${S.items.length}</h2><p>${u('time')}: ${Math.floor(S.ms/60000)}:${String(Math.floor(S.ms/1000)%60).padStart(2,'0')}</p><div class="q"><svg viewBox="0 0 300 260" class="pl" style="cursor:default">${[.33,.66,1].map(r=>`<polygon points="${[0,1,2,3,4,5].map(k=>pt(90*r,k).join(',')).join(' ')}" fill="none" stroke="#8aa"/>`).join('')}<polygon points="${poly}" fill="#0b7a7566" stroke="#0b7a75" stroke-width="2"/>${lab.map((l,k)=>`<text x="${pt(108,k)[0]}" y="${pt(108,k)[1]+4}" font-size="12" text-anchor="middle" fill="currentColor">${u(l)}</text>`).join('')}</svg></div><button class="btn" id="hm">${u('again')}</button>`;$('#hm').onclick=()=>{V='home';draw()}}
setInterval(()=>{const e=$('#tm');if(e&&S&&V=='run'){const s=Math.floor((Date.now()-S.t0)/1000);e.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},1000);
$('#bh').onclick=()=>{V='home';draw()};$('#bt').onclick=()=>{V='build';draw()};
$('#bl').onclick=()=>{L=1-L;if(V=='run'){const i=S.i;draw();S.i=i}else draw()};
$('#bm').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};
const CODE='ALTAKWEEN';
function gate(){$('header').style.display='none';$('#app').innerHTML='<section class="hero"><h1>🔬 SciQuest 4</h1><p>Enter passcode / أدخل رمز الدخول</p><div class="row"><input id="pc" type="password" autocomplete="off" aria-label="passcode" style="min-height:48px;font:inherit;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)"><button class="btn" id="pg">Open / فتح</button></div><p id="pe" class="msg"></p></section>';const go=()=>{if($('#pc').value.trim().toUpperCase()==CODE){try{sessionStorage.setItem('sq4ok','1')}catch(e){}$('header').style.display='';draw()}else $('#pe').textContent='Wrong passcode / رمز خاطئ'};$('#pg').onclick=go;$('#pc').onkeydown=e=>{if(e.key=='Enter')go()}}
let okp=0;try{okp=sessionStorage.getItem('sq4ok')}catch(e){}
okp?draw():gate();
</script></body></html>
