<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eTIMSS SciQuest 4</title>
<style>
:root{--bg:#f3f6f4;--sf:#ffffff;--tx:#14302b;--mu:#5b6f6a;--ln:#d5e0db;--pr:#0f6b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--pr);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
button{font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
header .btn{background:#fff;color:var(--pr)}
main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px 20px;max-width:1200px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px}
.pn h2{font-size:16px;margin:0 0 10px}
.pn h3{font-size:14px;margin:14px 0 6px;color:var(--mu)}
label.o{display:flex;gap:8px;align-items:center;padding:6px 0;min-height:36px;cursor:pointer}
.grp{font-weight:700;margin-top:10px;color:var(--pr)}
.big{font-size:26px;font-weight:700;color:var(--pr)}
.tg{font-size:12px;padding:3px 8px;border-radius:99px;color:#fff;display:inline-block;margin-inline-end:4px}
.q{border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0;background:var(--sf)}
.q ol{margin:8px 0;padding-inline-start:22px}
.q li.ok{font-weight:700;color:var(--pr)}
.ans .k{display:none}
.show .k{display:block}
.k{font-size:14px;color:var(--mu);background:var(--bg);padding:8px 12px;border-radius:6px;margin-top:8px}
.note{background:#fff4d6;color:#5a4300;padding:12px;border-radius:8px;margin:10px 0;font-size:14px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);cursor:pointer;font-size:16px}
.opt.sel{border-color:var(--pr);background:#eaf6ee;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st #side{display:none}
.st main{grid-template-columns:1fr}
.fb{padding:12px;border-radius:8px;margin:12px 0}
.good{background:#dff3e6;color:#14532d}
.bad{background:#fde2e0;color:#7f1d1d}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="ttl">eTIMSS SciQuest 4</h1>
    <small id="sub">علوم الصف الرابع · منشئ اختبارات TIMSS</small>
  </div>
  <div class="row">
    <button class="btn" id="langBtn" onclick="toggleLang()">English</button>
  </div>
</header>

<main>
  <aside id="side" class="pn">
    <h2 id="h_scope">١. اختر المواضيع</h2>
    <div id="topics"></div>

    <h3 id="h_len">٢. عدد الأسئلة</h3>
    <div class="big" id="nv">10</div>
    <input type="range" id="n" min="5" max="25" value="10" oninput="document.getElementById('nv').textContent=this.value" style="width:100%">

    <p style="margin-top:20px">
      <button class="btn" id="genBtn" onclick="buildExam()" style="width:100%;font-size:16px">إنشاء الاختبار</button>
    </p>
  </aside>

  <section id="out" class="pn">
    <!-- Exam / Question Area -->
  </section>
</main>

const RAW_B = [
  ['body','K',400,'Which bones protect the brain?|أي العظام تحمي الدماغ؟','Skull;Rib cage;Spine;Arm bones|الجمجمة;القفص الصدري;العمود الفقري;عظام الذراع','Confuses skull with rib cage|يخلط بين الجمجمة والقفص الصدري'],
  ['body','K',475,'Which organ pumps blood around the body?|أي عضو يضخ الدم في الجسم؟','Heart;Lungs;Stomach;Brain|القلب;الرئتان;المعدة;الدماغ','Lungs pump blood|يظن أن الرئتين تضخان الدم'],
  ['plants','K',400,'Which plant part takes in water from the soil?|أي جزء في النبات يمتص الماء من التربة؟','Roots;Leaves;Flower;Stem|الجذور;الأوراق;الزهرة;الساق','Leaves take water|يظن أن الأوراق تمتص الماء'],
  ['plants','K',475,'Which stage comes right after germination?|أي مرحلة تأتي مباشرة بعد الإنبات؟','Seedling growth;Pollination;Seed dispersal;Fruit forming|نمو الشتلة;التلقيح;انتشار البذور;تكوّن الثمرة','Mixes order|يخلط في الترتيب'],
  ['plants','A',475,'A seed has fluffy hairs like a parachute. How is it dispersed?|لبذرة شعيرات خفيفة كالمظلة. كيف تنتشر؟','By wind;By water;On animal fur;By exploding|بالرياح;بالماء;على فرو الحيوان;بالانفجار','Ignores structure|يهمل التركيب'],
  ['her','K',475,'Which trait is inherited?|أي صفة تُورَّث؟','Eye colour;A scar;A haircut;A broken branch|لون العينين;ندبة;قصّة شعر;غصن مكسور','Acquired traits inherited|يظن أن الصفات المكتسبة تورث'],
  ['her','A',475,'A dog loses its tail in an accident. What are its puppies like?|فقد كلب ذيله في حادث. كيف سيكون صغاره؟','Born with normal tails;Born with no tails;Born with short tails;Lose tails later|يولدون بذيول عادية;بلا ذيول;بذيول قصيرة;يفقدون ذيولهم لاحقًا','Acquired changes inherited|يظن أن التغيرات العارضة تورث'],

  ['eco','A',550,'In that chain, frogs disappear. What happens to grasshoppers first?|في السلسلة السابقة اختفت الضفادع. ماذا يحدث للجندب أولًا؟','Their number increases;Their number decreases;No change;They disappear|يزداد عددها;يقل عددها;لا تتغير;تختفي','Predator removal harms prey|يظن أن زوال المفترس يضر بالفريسة'],
  ['eco','R',550,'Sara tests if light affects plant growth. What must stay the same?|تختبر سارة أثر الضوء في نمو النبات. ما الذي يجب أن يبقى ثابتًا؟','Amount of water;Amount of light;Final height;Nothing|كمية الماء;كمية الضوء;الطول النهائي;لا شيء','Fair test variable|لا يعزل المتغيرات'],

  ['mat','A',475,'Where does sugar dissolve fastest?|أين يذوب السكر أسرع؟','Hot water, stirred;Cold water, stirred;Hot water, not stirred;Cold water, not stirred|ماء ساخن مع التحريك;ماء بارد مع التحريك;ماء ساخن دون تحريك;ماء بارد دون تحريك','Single factor|ينتبه لعامل واحد'],
